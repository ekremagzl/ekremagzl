name: diller

# METRICS_TOKEN (isteğe bağlı): `repo` izinli kişisel token. Eklersen gizli repoların
# da dil istatistiğine girer; eklemezsen yalnızca açık repolar sayılır.
# Repo > Settings > Secrets and variables > Actions > New repository secret

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Dil kartını üret
        env:
          GH_TOKEN: ${{ secrets.METRICS_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
        run: python3 scripts/build_languages.py

      - name: Commit & Push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add assets/languages.svg
          if git commit -m "dil kartı güncellendi"; then
            git push
          fi
