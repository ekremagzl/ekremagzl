<svg xmlns="http://www.w3.org/2000/svg" width="880" height="230" viewBox="0 0 880 230" role="img" aria-label="En çok kullandığım diller">
<style>
  :root { --t: #1f2328; --m: #656d76; --r: #d0d7de; --bg: #ffffff; --c0: #0f766e; --c1: #14b8a6; --c2: #115e59; --c3: #5eead4; --c4: #134e4a; --c5: #8c959f; }
  @media (prefers-color-scheme: dark) { :root { --t: #e6edf3; --m: #7d8590; --r: #30363d; --bg: #0d1117; --c0: #2dd4bf; --c1: #14937f; --c2: #99f6e4; --c3: #0f766e; --c4: #5eead4; --c5: #6e7681; } }
  text { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
  .arc { opacity: 0; animation: fade .6s .1s forwards; }
  .row { opacity: 0; animation: fade .4s forwards; }
  .bar { transform-box: fill-box; transform-origin: left; animation: grow .9s .4s cubic-bezier(.2,.8,.2,1) both; }
  @keyframes fade { to { opacity: 1; } }
  @keyframes grow { from { transform: scaleX(0); } }
  @media (prefers-reduced-motion: reduce) { .arc, .row { animation: none; opacity: 1; } .bar { animation: none; } }
</style>
